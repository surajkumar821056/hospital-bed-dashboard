spring.application.name=medresq-backend
debug=false
logging.level.org.springframework=INFO
spring.profiles.default=dev
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/medresq}
spring.datasource.username=${DATABASE_USER:medresq}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
server.error.include-message=never
app.admin.email=${ADMIN_EMAIL:admin@medresq.gov}
app.admin.password=${ADMIN_PASSWORD:}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
